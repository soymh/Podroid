name: Build Podroid APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build kernel + initramfs
        run: ./build-all.sh initramfs

      - name: Upload kernel + initramfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            app/src/main/assets/vmlinuz-virt
            app/src/main/assets/initrd.img
          retention-days: 1

  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rootfs
        run: ./build-all.sh rootfs

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: app/src/main/assets/alpine-rootfs.squashfs
          retention-days: 1

  build-qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build QEMU + bridge
        run: ./build-all.sh qemu

      - name: Upload QEMU libraries
        uses: actions/upload-artifact@v4
        with:
          name: qemu-libs
          path: app/src/main/jniLibs/
          retention-days: 1

      - name: Upload QEMU assets
        uses: actions/upload-artifact@v4
        with:
          name: qemu-assets
          path: app/src/main/assets/qemu/
          retention-days: 1

  build-apk:
    runs-on: ubuntu-latest
    needs: [build-kernel, build-rootfs, build-qemu]
    steps:
      - uses: actions/checkout@v4

      - name: Download kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel
          path: app/src/main/assets/

      - name: Download rootfs
        uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: app/src/main/assets/

      - name: Download QEMU libs
        uses: actions/download-artifact@v4
        with:
          name: qemu-libs
          path: app/src/main/jniLibs/

      - name: Download QEMU assets
        uses: actions/download-artifact@v4
        with:
          name: qemu-assets
          path: app/src/main/assets/qemu/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: podroid-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
