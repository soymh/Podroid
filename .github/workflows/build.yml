name: Build Podroid APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]  # tag pushes trigger a GitHub Release
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build kernel + initramfs
        run: ./build-all.sh initramfs

      - name: Upload vmlinuz-virt
        uses: actions/upload-artifact@v4
        with:
          name: vmlinuz-virt
          path: app/src/main/assets/vmlinuz-virt
          retention-days: 1

      - name: Upload initrd
        uses: actions/upload-artifact@v4
        with:
          name: initrd
          path: app/src/main/assets/initrd.img
          retention-days: 1

  build-rootfs-alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Alpine rootfs
        run: ./build-all.sh rootfs --distro=alpine

      - name: Upload Alpine rootfs
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-alpine
          path: app/src/main/assets/alpine-rootfs.squashfs
          retention-days: 1

  build-rootfs-arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Arch rootfs
        run: ./build-all.sh rootfs --distro=arch

      - name: Upload Arch rootfs
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-arch
          path: app/src/main/assets/arch-rootfs.squashfs
          retention-days: 1

  build-qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build QEMU + bridge
        run: ./build-all.sh qemu

      - name: Upload jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: app/src/main/jniLibs/
          retention-days: 1

      - name: Upload QEMU assets
        uses: actions/upload-artifact@v4
        with:
          name: qemu-assets
          path: app/src/main/assets/qemu/
          retention-days: 1

  build-apk:
    runs-on: ubuntu-latest
    needs: [build-kernel, build-rootfs-alpine, build-rootfs-arch, build-qemu]
    steps:
      - uses: actions/checkout@v4

      - name: Download vmlinuz-virt
        uses: actions/download-artifact@v4
        with:
          name: vmlinuz-virt
          path: app/src/main/assets/

      - name: Download initrd
        uses: actions/download-artifact@v4
        with:
          name: initrd
          path: app/src/main/assets/

      - name: Download Alpine rootfs
        uses: actions/download-artifact@v4
        with:
          name: rootfs-alpine
          path: app/src/main/assets/

      - name: Download Arch rootfs
        uses: actions/download-artifact@v4
        with:
          name: rootfs-arch
          path: app/src/main/assets/

      - name: Stage flavor rootfs assets
        run: |
          mkdir -p app/src/alpine/assets app/src/arch/assets
          cp -f app/src/main/assets/alpine-rootfs.squashfs app/src/alpine/assets/alpine-rootfs.squashfs
          cp -f app/src/main/assets/arch-rootfs.squashfs app/src/arch/assets/arch-rootfs.squashfs
          ls -la app/src/alpine/assets/ app/src/arch/assets/

      - name: Download jniLibs
        uses: actions/download-artifact@v4
        with:
          name: jniLibs
          path: app/src/main/jniLibs/

      - name: Download QEMU assets
        uses: actions/download-artifact@v4
        with:
          name: qemu-assets
          path: app/src/main/assets/qemu/

      - name: Verify assets exist
        run: |
          echo "=== Assets ==="
          ls -la app/src/main/assets/vmlinuz-virt
          ls -la app/src/main/assets/initrd.img
          ls -la app/src/alpine/assets/alpine-rootfs.squashfs
          ls -la app/src/arch/assets/arch-rootfs.squashfs
          echo "=== jniLibs ==="
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build debug APKs
        run: ./gradlew assembleAlpineDebug assembleArchDebug

      - name: Upload Alpine debug APK
        uses: actions/upload-artifact@v4
        with:
          name: podroid-debug-alpine
          path: app/build/outputs/apk/alpine/debug/app-alpine-debug.apk
          retention-days: 7

      - name: Upload Arch debug APK
        uses: actions/upload-artifact@v4
        with:
          name: podroid-debug-arch
          path: app/build/outputs/apk/arch/debug/app-arch-debug.apk
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [build-kernel, build-rootfs-alpine, build-rootfs-arch, build-qemu, build-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # required to create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Download vmlinuz-virt
        uses: actions/download-artifact@v4
        with:
          name: vmlinuz-virt
          path: app/src/main/assets/

      - name: Download initrd
        uses: actions/download-artifact@v4
        with:
          name: initrd
          path: app/src/main/assets/

      - name: Download Alpine rootfs
        uses: actions/download-artifact@v4
        with:
          name: rootfs-alpine
          path: app/src/main/assets/

      - name: Download Arch rootfs
        uses: actions/download-artifact@v4
        with:
          name: rootfs-arch
          path: app/src/main/assets/

      - name: Stage flavor rootfs assets
        run: |
          mkdir -p app/src/alpine/assets app/src/arch/assets
          cp -f app/src/main/assets/alpine-rootfs.squashfs app/src/alpine/assets/alpine-rootfs.squashfs
          cp -f app/src/main/assets/arch-rootfs.squashfs app/src/arch/assets/arch-rootfs.squashfs

      - name: Download jniLibs
        uses: actions/download-artifact@v4
        with:
          name: jniLibs
          path: app/src/main/jniLibs/

      - name: Download QEMU assets
        uses: actions/download-artifact@v4
        with:
          name: qemu-assets
          path: app/src/main/assets/qemu/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode release keystore
        run: |
          echo "${{ secrets.PODROID_RELEASE_KEYSTORE_B64 }}" | base64 -d > podroid-release.jks
          ls -la podroid-release.jks

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build release APKs
        run: ./gradlew assembleAlpineRelease assembleArchRelease
        env:
          PODROID_RELEASE_STORE_FILE: podroid-release.jks
          PODROID_RELEASE_STORE_PASSWORD: ${{ secrets.PODROID_RELEASE_STORE_PASSWORD }}
          PODROID_RELEASE_KEY_ALIAS: ${{ secrets.PODROID_RELEASE_KEY_ALIAS }}
          PODROID_RELEASE_KEY_PASSWORD: ${{ secrets.PODROID_RELEASE_KEY_PASSWORD }}

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/alpine/release/app-alpine-release.apk \
             app/build/outputs/apk/release/podroid-${{ steps.version.outputs.VERSION }}-alpine.apk
          mv app/build/outputs/apk/arch/release/app-arch-release.apk \
             app/build/outputs/apk/release/podroid-${{ steps.version.outputs.VERSION }}-arch.apk
          ls -la app/build/outputs/apk/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Podroid v${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/podroid-${{ steps.version.outputs.VERSION }}-alpine.apk
            app/build/outputs/apk/release/podroid-${{ steps.version.outputs.VERSION }}-arch.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
