name: Build Podroid APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]  # tag pushes trigger a GitHub Release
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build kernel + initramfs
        run: ./build-all.sh initramfs

      - name: Upload vmlinuz-virt
        uses: actions/upload-artifact@v4
        with:
          name: vmlinuz-virt
          path: app/src/main/assets/vmlinuz-virt
          retention-days: 1

      - name: Upload initrd
        uses: actions/upload-artifact@v4
        with:
          name: initrd
          path: app/src/main/assets/initrd.img
          retention-days: 1

  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rootfs
        run: ./build-all.sh rootfs

      - name: Upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: app/src/main/assets/alpine-rootfs.squashfs
          retention-days: 1

  build-qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build QEMU + bridge
        run: ./build-all.sh qemu

      - name: Upload jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: app/src/main/jniLibs/
          retention-days: 1

      - name: Upload QEMU assets
        uses: actions/upload-artifact@v4
        with:
          name: qemu-assets
          path: app/src/main/assets/qemu/
          retention-days: 1

  build-apk:
    runs-on: ubuntu-latest
    needs: [build-kernel, build-rootfs, build-qemu]
    steps:
      - uses: actions/checkout@v4

      - name: Download vmlinuz-virt
        uses: actions/download-artifact@v4
        with:
          name: vmlinuz-virt
          path: app/src/main/assets/

      - name: Download initrd
        uses: actions/download-artifact@v4
        with:
          name: initrd
          path: app/src/main/assets/

      - name: Download rootfs
        uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: app/src/main/assets/

      - name: Download jniLibs
        uses: actions/download-artifact@v4
        with:
          name: jniLibs
          path: app/src/main/jniLibs/

      - name: Download QEMU assets
        uses: actions/download-artifact@v4
        with:
          name: qemu-assets
          path: app/src/main/assets/qemu/

      - name: Verify assets exist
        run: |
          echo "=== Assets ==="
          ls -la app/src/main/assets/vmlinuz-virt
          ls -la app/src/main/assets/initrd.img
          ls -la app/src/main/assets/alpine-rootfs.squashfs
          echo "=== jniLibs ==="
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: podroid-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [build-kernel, build-rootfs, build-qemu, build-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # required to create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Download vmlinuz-virt
        uses: actions/download-artifact@v4
        with:
          name: vmlinuz-virt
          path: app/src/main/assets/

      - name: Download initrd
        uses: actions/download-artifact@v4
        with:
          name: initrd
          path: app/src/main/assets/

      - name: Download rootfs
        uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: app/src/main/assets/

      - name: Download jniLibs
        uses: actions/download-artifact@v4
        with:
          name: jniLibs
          path: app/src/main/jniLibs/

      - name: Download QEMU assets
        uses: actions/download-artifact@v4
        with:
          name: qemu-assets
          path: app/src/main/assets/qemu/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode release keystore
        run: |
          echo "${{ secrets.PODROID_RELEASE_KEYSTORE_B64 }}" | base64 -d > podroid-release.jks
          ls -la podroid-release.jks

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          PODROID_RELEASE_STORE_FILE: podroid-release.jks
          PODROID_RELEASE_STORE_PASSWORD: ${{ secrets.PODROID_RELEASE_STORE_PASSWORD }}
          PODROID_RELEASE_KEY_ALIAS: ${{ secrets.PODROID_RELEASE_KEY_ALIAS }}
          PODROID_RELEASE_KEY_PASSWORD: ${{ secrets.PODROID_RELEASE_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/podroid-${{ steps.version.outputs.VERSION }}.apk
          ls -la app/build/outputs/apk/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Podroid v${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/podroid-${{ steps.version.outputs.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
