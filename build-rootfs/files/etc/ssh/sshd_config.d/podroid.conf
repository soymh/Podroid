# Podroid guest SSH defaults (ArchDroid / Arch rootfs only).
# Arch's stock sshd_config ships PermitRootLogin prohibit-password, which
# rejects the documented root+password login. This drop-in (read via the
# Include line Arch's openssh PKGBUILD prepends; first-match-wins, and
# 99-archlinux.conf sets neither key) restores it.
PermitRootLogin yes
PasswordAuthentication yes
